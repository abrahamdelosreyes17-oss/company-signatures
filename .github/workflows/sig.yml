name: signatures
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency: { group: sig, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node sig-job.mjs
        env:
          SITE: ${{ vars.SITE }}
          SIG_JOB_SECRET: ${{ secrets.SIG_JOB_SECRET }}
